name: Supabase Keep-Alive
# Objectif : empêcher la mise en pause automatique du projet Supabase
# (plan gratuit) après 7 jours d'inactivité, en effectuant une requête
# légère toutes les 3 jours.
on:
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch:
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (garde le projet actif)
        run: |
          curl -sS -o /dev/null -w "Code HTTP : %{http_code}\n" \
            "https://tclqiusyonocedobtoky.supabase.co/rest/v1/blog_drafts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept-Profile: public"
